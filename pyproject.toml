[build-system]
requires = ["hatchling>=1.27"]  # 1.27+ reads the SPDX `license = "MIT"` string
build-backend = "hatchling.build"

[project]
name = "manimvox"
dynamic = ["version"]
description = "Narrated, animated explainer videos with Manim and pluggable voices, driven by agent skills."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["manim", "explainer", "video", "animation", "text-to-speech", "agent-skills", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
  "manim>=0.22,<0.23",
  "numpy>=1.26",
  "soundfile>=0.12",
  "av>=12",
  "pillow>=10",
  "pycairo>=1.14,<2",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4,<0.7"]
piper = ["piper-tts>=1.8,<2"]
edge = ["edge-tts>=7,<8"]
xtts = ["coqui-tts>=0.27,<0.28"]
f5 = ["f5-tts>=1.1,<2"]
# OpenAI and ElevenLabs use the standard library; the extra keeps the documented install command working
cloud = []
matplotlib = ["matplotlib>=3.8,<4"]
plotly = ["plotly>=6.1,<8", "kaleido>=1.1,<2"]
# 3D models: trimesh reads them for the mesh-model block, PyVista renders them with lighting as clips
trimesh = ["trimesh>=4.5,<6", "fast-simplification>=0.1.9,<1"]
pyvista = ["pyvista>=0.45,<1", "vtk>=9.4,<10"]
# agent frameworks: manimvox.integrations.<name>
agno = ["agno>=3.1,<4"]
langchain = ["langchain-core>=1.6,<2", "deepagents>=0.7,<0.8"]
pydantic-ai = ["pydantic-ai-slim>=2.57,<3"]
openai-agents = ["openai-agents>=0.24,<0.25"]
crewai = ["crewai>=1.15.28,<1.16; python_version < '3.14'"]
llamaindex = ["llama-index-core>=0.14.25,<0.15"]
haystack = ["haystack-ai>=3.4,<3.5"]
google-adk = ["google-adk>=2.12,<2.13"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8,<4", "plotly>=6.1,<8", "trimesh>=4.5,<6", "fast-simplification>=0.1.9,<1"]

[project.urls]
Homepage = "https://github.com/LaplacianAI/manimvox"
Source = "https://github.com/LaplacianAI/manimvox"
Issues = "https://github.com/LaplacianAI/manimvox/issues"

[project.scripts]
manimvox = "manimvox.cli:main"

[tool.hatch.version]
path = "src/manimvox/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["docs/specs", "docs/plans", ".superpowers"]

[tool.hatch.build.targets.wheel]
packages = ["src/manimvox"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "manimvox/_skills"
"blocks" = "manimvox/_blocks"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: renders video with Manim (seconds to a minute)",
  "kokoro: needs the kokoro extra and its model files on disk",
  "piper: needs the piper extra and network or a downloaded voice",
]
addopts = "-m 'not kokoro and not piper'"

[tool.ruff]
line-length = 120

[tool.uv]
# crewai needs openai<3 (openai-agents needs >=3) and rich>=14.2 (f5-tts's cached-path needs rich<14)
conflicts = [[{ extra = "crewai" }, { extra = "openai-agents" }], [{ extra = "crewai" }, { extra = "f5" }]]
