[build-system]
requires = ["hatchling>=1.27"]  # 1.27+ reads the SPDX `license = "MIT"` string
build-backend = "hatchling.build"

[project]
name = "manimvox"
dynamic = ["version"]
description = "Narrated, animated explainer videos with Manim and pluggable voices, driven by agent skills."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "manim>=0.22,<0.23",
  "numpy>=1.26",
  "soundfile>=0.12",
  "av>=12",
  "pillow>=10",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4,<0.7"]
piper = ["piper-tts>=1.8,<2"]
edge = ["edge-tts>=7,<8"]
# OpenAI and ElevenLabs use the standard library; the extra keeps the documented install command working
cloud = []
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
manimvox = "manimvox.cli:main"

[tool.hatch.version]
path = "src/manimvox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/manimvox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: renders video with Manim (seconds to a minute)",
  "kokoro: needs the kokoro extra and its model files on disk",
  "piper: needs the piper extra and network or a downloaded voice",
]
addopts = "-m 'not kokoro and not piper'"

[tool.ruff]
line-length = 120
