name: Release

# Push a tag vX.Y.Z equal to manimvox.__version__ to build and publish to PyPI.
# PyPI trusts this workflow through trusted publishing: no token is stored in GitHub.

on:
  push:
    tags: ["v*"]

# ubuntu-24.04, not ubuntu-latest: the 26.04 image from 2026-11-01 cannot resolve Ubuntu's package servers. Back to ubuntu-latest once GitHub fixes it.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/manimvox/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but __version__ is $version"; exit 1; }
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/manimvox/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
