name: Docs

# Builds the documentation site on every pull request (strict: a warning fails it) and publishes it to
# GitHub Pages from main. Repository settings: Pages, Source = GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # Neither step needs manimvox's dependencies (Manim, Cairo): the gallery and leaderboard scripts use the
      # standard library, and the API pages read the source without importing it. Versions match the docs extra.
      - name: Block gallery from blocks/*/block.json and preview.png
        run: PYTHONPATH=src uv run --no-project python -m manimvox.blocks docs
      - name: Leaderboards from benchmarks/runs/*/run.json
        run: uv run --no-project python benchmarks/leaderboard.py
      - name: Build (strict)
        run: >-
          uv run --no-project --with "zensical>=0.0.71,<0.1" --with "mkdocstrings-python>=1.18,<3"
          zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
