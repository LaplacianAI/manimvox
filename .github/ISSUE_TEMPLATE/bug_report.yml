name: Bug report
description: Something in manimvox doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. For a security problem, don't open an issue; follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead. Paste the error in full.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest episode, command or tool call that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `manimvox doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How was manimvox being used?
      options:
        - By a coding agent, through its skills
        - From a Python agent framework, through its tools
        - By hand, with the command line or Python
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent, if any
      placeholder: e.g. Claude Code, Codex, Cursor, Gemini CLI, Agno
