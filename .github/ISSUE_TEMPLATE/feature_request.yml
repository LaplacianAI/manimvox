name: Feature request
description: Suggest something manimvox should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you, or your agent, trying to make, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. A sketch of the episode code or the command is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds or other tools you considered.
